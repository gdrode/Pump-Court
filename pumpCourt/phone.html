<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self'" />
    <title>Pump-Court phone camera</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
      body { margin: 0; background: #111110; color: #fff; display: flex; flex-direction: column; min-height: 100dvh; }
      main { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px; }
      h1 { font-size: 18px; margin: 0; }
      video { width: 100%; max-height: 60dvh; background: #000; border-radius: 8px; object-fit: contain; }
      #status { font-size: 16px; color: #c3c2b7; }
      #status.ok { color: #0ca30c; }
      #status.err { color: #ff8a8a; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      button { font: inherit; font-size: 16px; color: #fff; background: #232321; border: 1px solid #2c2c2a; border-radius: 8px; padding: 12px 16px; flex: 1; }
      button.primary { background: #3987e5; border-color: #3987e5; }
      p { color: #898781; font-size: 14px; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pump-Court phone camera</h1>
      <div id="status">Tap Start to use this phone as a camera.</div>
      <video id="preview" autoplay playsinline muted></video>
      <div class="row">
        <button id="start" class="primary">Start camera</button>
        <button id="flip" hidden>Flip camera</button>
      </div>
      <p>Prop the phone side-on to the player, in landscape. Keep this page open; the screen stays on while streaming. Video goes straight to the laptop over Wi-Fi and is not recorded.</p>
    </main>
    <script type="module" src="/src/phone/main.ts"></script>
  </body>
</html>
