<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pump Court camera</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
  body { margin: 0; background: #0d0f14; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  h1 { font-size: 18px; margin: 0; flex: 1; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #6b7280; }
  .dot.live { background: #4ade80; box-shadow: 0 0 10px #4ade80; }
  .dot.bad { background: #f87171; }
  video { width: 100%; flex: 1; object-fit: contain; background: #000; min-height: 0; }
  .bar { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select { font-size: 16px; padding: 10px 14px; border-radius: 8px; border: 1px solid #2a2f3b; background: #171a22; color: inherit; }
  button.primary { background: #4ade80; color: #052e16; border-color: #4ade80; font-weight: 600; }
  #status { color: #9ca3af; font-size: 14px; width: 100%; }
  .hint { color: #fde68a; font-size: 14px; padding: 0 16px; }
</style>
</head>
<body>
<header><div id="dot" class="dot"></div><h1>Pump Court camera</h1><span id="fps"></span></header>
<video id="video" playsinline muted autoplay></video>
<p class="hint" id="hint">Prop the phone side-on to the mat, in landscape, then press Start.</p>
<div class="bar">
  <button id="start" class="primary">Start camera</button>
  <select id="facing"><option value="environment">Back camera</option><option value="user">Front camera</option></select>
  <select id="size"><option value="640">640 px (fast)</option><option value="960" selected>960 px</option><option value="1280">1280 px (sharp)</option></select>
  <div id="status">Not streaming</div>
</div>
<script>
// Streams the camera to the Pump Court desktop app that served this page.
// Protocol: one JSON "hello" text message, then one binary JPEG per frame.
const code = new URLSearchParams(location.search).get("code") || "";
const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = document.createElement("canvas"), ctx = canvas.getContext("2d");
const TARGET_FPS = 30, MAX_BUFFERED = 512 * 1024;
let ws = null, stream = null, running = false, sent = 0, lastFpsAt = performance.now(), lastSend = 0, wakeLock = null, retry = 1000;

function setStatus(text, state) {
  $("status").textContent = text;
  $("dot").className = "dot" + (state ? " " + state : "");
}

async function startCamera() {
  stream?.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: $("facing").value, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 } },
  });
  video.srcObject = stream;
  await video.play();
}

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws?code=${encodeURIComponent(code)}`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    retry = 1000;
    ws.send(JSON.stringify({ type: "hello", device: navigator.userAgent.slice(0, 120) }));
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "welcome") setStatus("Connected — streaming to the laptop", "live");
    if (msg.type === "replaced") { running = false; setStatus("Another phone took over, or the code changed. Scan the new QR code.", "bad"); }
  };
  ws.onclose = () => {
    if (!running) return;
    setStatus("Lost the laptop — reconnecting…", "bad");
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 8000);
  };
}

function sendFrame() {
  if (!running) return;
  const now = performance.now();
  // Pace to the target rate, and skip frames if the network is backed up.
  if (now - lastSend >= 1000 / TARGET_FPS - 2 && ws?.readyState === 1 && ws.bufferedAmount < MAX_BUFFERED && video.videoWidth) {
    lastSend = now;
    const w = Math.min(Number($("size").value), video.videoWidth);
    canvas.width = w;
    canvas.height = Math.round((video.videoHeight / video.videoWidth) * w);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.toBlob((blob) => { if (blob && ws?.readyState === 1) { ws.send(blob); sent++; } }, "image/jpeg", 0.7);
  }
  if (now - lastFpsAt >= 1000) {
    $("fps").textContent = `${sent} fps`;
    sent = 0;
    lastFpsAt = now;
  }
  if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(sendFrame);
  else requestAnimationFrame(sendFrame);
}

$("start").onclick = async () => {
  if (running) {
    running = false;
    ws?.close();
    stream?.getTracks().forEach((t) => t.stop());
    $("start").textContent = "Start camera";
    setStatus("Not streaming");
    return;
  }
  try {
    await startCamera();
    running = true;
    connect();
    sendFrame();
    $("start").textContent = "Stop";
    $("hint").textContent = "Keep this page open. The screen stays on while streaming.";
    setStatus("Connecting…");
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  } catch (err) {
    setStatus("Camera blocked: " + err.message + ". Allow camera access for this page and try again.", "bad");
  }
};
$("facing").onchange = () => running && startCamera();
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && running) {
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  }
});
if (!window.isSecureContext) setStatus("This page must be opened over https:// for camera access.", "bad");
</script>
</body>
</html>
