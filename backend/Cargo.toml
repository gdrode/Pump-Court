[package]
name = "pump-court"
version = "0.1.0"
description = "A push-up contest judged by software"
edition = "2021"

# The library holds all the app logic; src/main.rs is a tiny launcher.
[lib]
name = "pump_court_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "bundled" compiles SQLite into the app, so nothing has to be installed.
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"

# Phone camera link: the desktop runs a small HTTPS + WebSocket server on the
# local network that a phone's browser streams its camera to.
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
tokio = { version = "1", features = ["rt", "time", "sync"] }
