[package]
name = "pump-court"
version = "0.1.0"
description = "A push-up contest judged by software"
edition = "2021"

# The library holds all the app logic; src/main.rs is a tiny launcher.
[lib]
name = "pump_court_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "bundled" compiles SQLite into the app, so nothing has to be installed.
rusqlite = { version = "0.32", features = ["bundled"] }

# Phone cameras: the desktop runs a small HTTPS server on the local network
# that serves the phone camera page and introduces phone and app (WebRTC).
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
local-ip-address = "0.6"
rand = "0.8"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }

# Linux only: lets the window open the laptop camera (the web view keeps it off by default).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[features]
# Bakes the built frontend into the executable, so it runs without a dev
# server. `cargo tauri build` turns this on by itself; the launch scripts in
# scripts/ turn it on too.
custom-protocol = ["tauri/custom-protocol"]
